syntax = "proto3";

package ping;

// A no-op service that exists only to prove the transport works.
// No auction logic lives here, and none ever will.
service PingService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
  string served_by = 2;
}
