syntax = "proto3";

package status;

// Observability for the dashboard, the chaos harness and the property
// checker (docs/testing-and-chaos.md). Served on the PEER port, next to
// RaftService, with no auth interceptor: the callers are operator tools, not
// users, and carry no session token (same reasoning as RaftService,
// docs/decisions.md A9 and T2). In production this port is reachable only
// from inside the cluster.
//
// Read-only. Nothing here changes Raft or auction state, and nothing here
// goes through the log: it reports THIS node's local view, which may be
// stale (a follower's, or a deposed leader's). That is the point: the
// dashboard wants to see disagreement when it happens.

service StatusService {
  rpc GetNodeStatus(NodeStatusRequest) returns (NodeStatus);
  // Debug only: the whole applied state, for the checker.
  rpc DumpState(DumpStateRequest) returns (StateDump);
  // Operator switch: PreVote on or off on this node (raft/node.py
  // set_prevote). Volatile: a restarted node starts with its --prevote flag.
  rpc SetPreVote(SetPreVoteRequest) returns (NodeStatus);
}

message SetPreVoteRequest {
  bool on = 1;
}

message NodeStatusRequest {
  // The digest costs a deep copy of the whole state under the state-machine
  // lock (~190 ms at 25 000 bids, docs/decisions.md T16). Callers that only
  // need roles, terms and indexes leave this false and pay nothing; then
  // state_digest is "" and digest_index is the last applied command index.
  bool include_digest = 1;
}

message NodeStatus {
  string node_id = 1;
  string role = 2;              // FOLLOWER / CANDIDATE / LEADER
  int64 term = 3;               // currentTerm
  string leader_id = 4;         // "" when unknown
  string voted_for = 5;         // "" when none in this term
  int64 commit_index = 6;       // Figure 2: commitIndex
  int64 last_applied = 7;       // Figure 2: lastApplied
  int64 last_log_index = 8;
  int64 last_log_term = 9;
  // sha256 hex of the canonical applied state (replication/digest.py):
  // auctions, sessions (tokens hashed) and the dedupe table. Two nodes
  // with equal digest_index must have equal digests.
  string state_digest = 10;
  // The index of the last COMMAND entry folded into state_digest. Can be
  // below last_applied: no-op entries never reach the state machine.
  int64 digest_index = 11;

  // --- liveness telemetry, for the web dashboard (dashboard/) ---------------
  // Local counters, not replicated, reset when the process restarts.
  //
  // Follower / candidate side: AppendEntries RPCs accepted from the leader of
  // the current term (heartbeats and entry-carrying ones alike: in Raft a
  // heartbeat IS an AppendEntries), and how long ago the last one arrived.
  int64 heartbeats_received = 12;
  int64 last_heartbeat_age_ms = 13;   // -1 = none since this process started
  // Time left on the election timer; it is reset by every heartbeat. 0 on a
  // leader (a leader has no election timer).
  int64 election_timer_left_ms = 14;
  // Leader side: heartbeat rounds sent (one per heartbeat interval), and per
  // follower, replies received in this term.
  int64 heartbeats_sent = 15;
  repeated PeerReplication peers = 16;
  int64 heartbeat_interval_ms = 17;
  int64 election_timeout_min_ms = 18;
  int64 election_timeout_max_ms = 19;
  int64 pid = 20;                     // this process's id (os.getpid())
  bool prevote = 21;                  // PreVote on (Ongaro's thesis 9.6)?
}

message PeerReplication {
  string peer_id = 1;
  int64 replies = 2;           // AppendEntries replies from this peer, this term
  int64 last_reply_age_ms = 3; // -1 = none yet
  int64 match_index = 4;       // Figure 2 matchIndex
  int64 next_index = 5;        // Figure 2 nextIndex
}

message DumpStateRequest {}

message StateDump {
  string node_id = 1;
  int64 digest_index = 2;
  string state_digest = 3;
  // The canonical JSON the digest is computed over, byte for byte:
  // state_digest == sha256(state_json.encode("utf-8")). Auctions sorted
  // by id, bids in the order applied.
  string state_json = 4;
}
