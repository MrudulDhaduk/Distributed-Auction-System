[pytest]
testpaths = tests
# Capture at the Python level only. pytest's default (fd-level) capture
# replaces file descriptor 2 for the whole process. gRPC's C core logs to the
# stderr HANDLE it cached at start-up; on Windows that handle is closed by the
# replacement and its number is then handed out again, so a log line from the
# C core ("chttp2_transport.cc: Got goaway ...") landed inside a node's
# log.bin and the restarted node refused to start (CorruptStorageError).
# Seen on unmodified code: 11 of 14 runs of test_workload.py failed that way
# with default capture, 0 of 24 without it. docs/decisions.md, C21.
addopts = --capture=sys
